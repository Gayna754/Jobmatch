services:
  postgres:
    image: postgres:16-alpine
    container_name: jobmatch-postgres
    environment:
      POSTGRES_DB: jobmatch
      POSTGRES_USER: jobmatch
      POSTGRES_PASSWORD: jobmatch_dev_only
    ports:
      - "5432:5432"
    volumes:
      - jobmatch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobmatch -d jobmatch"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  jobmatch_pgdata:
